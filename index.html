<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Speed Race X</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(135deg,#050b15,#172b4a);
color:white;
text-align:center;
}

button,a{
font-family:inherit;
}

.hidden{
display:none!important;
}


/* ================= MENU ================= */

#menu{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.panel{
width:min(950px,96vw);
padding:30px;
background:rgba(10,20,38,.96);
border:1px solid #304766;
border-radius:28px;
box-shadow:0 25px 80px rgba(0,0,0,.7);
}

.logo{
font-size:75px;
filter:drop-shadow(0 0 20px #00e5ff);
}

h1{
font-size:clamp(42px,8vw,70px);
margin:0 0 8px;
}

h1 span{
color:#00e5ff;
text-shadow:0 0 20px #00e5ff;
}

.subtitle{
color:#aabbd0;
font-size:17px;
}

.stats{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:20px;
}

.stat{
background:#172840;
border:1px solid #334c6d;
padding:12px 22px;
border-radius:13px;
font-size:18px;
}

.stat b{
color:#00e5ff;
}

.cards{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

.card{
width:165px;
padding:16px;
background:linear-gradient(145deg,#1b2b45,#101d31);
border:2px solid #304766;
border-radius:18px;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
border-color:#00e5ff;
}

.card.selected{
border-color:#00e5ff;
box-shadow:0 0 25px rgba(0,229,255,.25);
}

.carEmoji{
font-size:55px;
}

.card p{
margin:7px 0;
color:#aebdd0;
}

.mainButtons{
margin-top:25px;
}

.btn{
display:inline-block;
border:0;
border-radius:13px;
padding:14px 24px;
margin:6px;
font-size:17px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
}

.start{
background:#00e5ff;
color:#001018;
box-shadow:0 0 20px rgba(0,229,255,.25);
}

.download{
background:#21e787;
color:#00140b;
}

.pink{
background:#ff3d71;
color:white;
}

.dark{
background:#1a2b44;
color:white;
border:1px solid #385270;
}

.help{
color:#8fa4bf;
font-size:13px;
margin-top:20px;
}


/* ================= GAME ================= */

#game{
min-height:100vh;
padding:8px;
}

.topbar{
max-width:700px;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
gap:7px;
flex-wrap:wrap;
}

.badge{
background:rgba(9,20,37,.95);
border:1px solid #304765;
border-radius:11px;
padding:9px 13px;
font-weight:bold;
}

.badge b{
color:#00e5ff;
}

#status{
height:22px;
margin:5px;
color:#aabbd0;
font-size:13px;
}

#canvas{
display:block;
width:min(520px,96vw);
height:auto;
margin:8px auto;
border:3px solid #00e5ff;
border-radius:16px;
background:#333;
box-shadow:
0 15px 50px rgba(0,0,0,.8),
0 0 25px rgba(0,229,255,.15);
touch-action:none;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
direction:ltr;
}

.control{
width:92px;
height:58px;
border:1px solid #3c5778;
border-radius:14px;
background:#15263e;
color:white;
font-size:25px;
font-weight:bold;
touch-action:none;
}

.control:active{
transform:scale(.94);
}

.nitroButton{
background:#21e787;
color:#00150c;
}


/* ================= MODAL ================= */

#modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
display:flex;
align-items:center;
justify-content:center;
z-index:50;
}

.modalBox{
width:min(500px,92vw);
padding:30px;
background:#101c31;
border:1px solid #395475;
border-radius:22px;
box-shadow:0 20px 70px #000;
}

.modalBox h2{
font-size:30px;
}


/* MOBILE */

@media(max-width:600px){

.panel{
padding:20px 12px;
}

.card{
width:140px;
}

h1{
font-size:43px;
}

.control{
width:82px;
}

}

</style>
</head>


<body>


<!-- =====================================================
                         MENU
===================================================== -->

<div id="menu">

<div class="panel">

<div class="logo">
🏎️
</div>

<h1>
Speed <span>Race X</span>
</h1>

<p class="subtitle">
لعبة سباق سيارات مطورة 🚀
</p>


<div class="stats">

<div class="stat">
💰 العملات:
<b id="coins">0</b>
</div>

<div class="stat">
🏆 أفضل نتيجة:
<b id="best">0</b>
</div>

</div>


<h2>
🚘 اختر سيارتك
</h2>

<div id="cars" class="cards"></div>


<h2>
🏁 اختر المرحلة
</h2>

<div id="levels" class="cards"></div>


<div class="mainButtons">

<button
class="btn start"
onclick="startGame()">

🎮 ابدأ السباق

</button>


<a
class="btn download"
href="SpeedRace.zip"
download>

⬇️ تحميل اللعبة

</a>

</div>


<p class="help">

⌨️ الكمبيوتر:
← → أو A / D للحركة
<br>

⚡ Space = نيترو
<br>

⏸️ P = إيقاف مؤقت

</p>

</div>

</div>



<!-- =====================================================
                         GAME
===================================================== -->

<div id="game" class="hidden">


<div class="topbar">


<div class="badge">
🏆
<b id="score">0</b>
</div>


<div class="badge">
💰
<b id="runCoins">0</b>
</div>


<div class="badge">
❤️
<b id="health">3</b>
</div>


<div class="badge">
⚡
<b id="nitroValue">100</b>%
</div>


<button
class="btn dark"
onclick="pauseGame()">

⏸️

</button>


<button
class="btn pink"
onclick="quitGame()">

خروج

</button>

</div>


<div id="status">

جاهز للسباق 🏎️

</div>


<canvas
id="canvas"
width="520"
height="760">
</canvas>


<div class="controls">


<button
class="control"
id="left">

⬅️

</button>


<button
class="control nitroButton"
id="nitroButton">

⚡

</button>


<button
class="control"
id="right">

➡️

</button>


</div>

</div>



<!-- =====================================================
                         MODAL
===================================================== -->

<div
id="modal"
class="hidden">

<div
class="modalBox"
id="modalBox">
</div>

</div>



<script>

/* =====================================================
                         CANVAS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const W=520;
const H=760;

const roadX=55;
const roadWidth=410;


/* =====================================================
                         LANES
===================================================== */

const lanes=[
100,
205,
310,
415
];


/* =====================================================
                         CARS
===================================================== */

const cars=[

{
name:"البرق",
color:"#00bfff",
speed:5.5,
price:0
},

{
name:"الصقر",
color:"#ff3d71",
speed:6.5,
price:250
},

{
name:"الصاروخ",
color:"#21e787",
speed:7.5,
price:600
},

{
name:"الظل",
color:"#a56cff",
speed:8.5,
price:1200
}

];


/* =====================================================
                         LEVELS
===================================================== */

const levels=[

{
name:"المدينة",
emoji:"🌆",
background:"#3f8c54",
road:"#33383d",
speed:1
},

{
name:"الصحراء",
emoji:"🌵",
background:"#c99a56",
road:"#3b3937",
speed:1.25
},

{
name:"الجليد",
emoji:"❄️",
background:"#a9dbe9",
road:"#414950",
speed:1.5
},

{
name:"الليل",
emoji:"🌃",
background:"#08162d",
road:"#242b36",
speed:1.8
}

];


/* =====================================================
                         SAVE DATA
===================================================== */

let data =
JSON.parse(
localStorage.getItem("speedRaceX")
);


if(!data){

data={
coins:0,
best:0,
car:0,
level:0,
owned:[
true,
false,
false,
false
]
};

}


/* =====================================================
                         PLAYER
===================================================== */

let player={

x:235,
y:640,

width:50,
height:82

};


/* =====================================================
                         GAME STATE
===================================================== */

let game={

running:false,
paused:false,

score:0,
coins:0,
health:3,
nitro:100,

enemies:[],
coinsObjects:[],

roadMove:0,

spawn:0,
coinSpawn:0,

shake:0

};


let keys={

left:false,
right:false,
nitro:false

};


let animation=0;
let lastTime=0;


/* =====================================================
                         SAVE
===================================================== */

function save(){

localStorage.setItem(
"speedRaceX",
JSON.stringify(data)
);

}


/* =====================================================
                         MENU
===================================================== */

function renderMenu(){

document.getElementById("coins")
.textContent=data.coins;

document.getElementById("best")
.textContent=data.best;


/* CARS */

document.getElementById("cars")
.innerHTML=

cars.map((car,i)=>`

<div
class="card
${data.car===i?"selected":""}"
onclick="chooseCar(${i})">

<div class="carEmoji">
🏎️
</div>

<b>
${car.name}
</b>

<p>
⚡ السرعة ${car.speed}
</p>

<p>
${
data.owned[i]
?
"✓ مملوكة"
:
"🔒 "+car.price+" 💰"
}
</p>

</div>

`).join("");


/* LEVELS */

document.getElementById("levels")
.innerHTML=

levels.map((level,i)=>`

<div
class="card
${data.level===i?"selected":""}"
onclick="chooseLevel(${i})">

<div class="carEmoji">
${level.emoji}
</div>

<b>
${level.name}
</b>

<p>
${i===0?"مدينة":
i===1?"صحراء":
i===2?"جليد":
"ليل"}
</p>

</div>

`).join("");

}


/* =====================================================
                         CHOOSE CAR
===================================================== */

function chooseCar(i){

if(data.owned[i]){

data.car=i;

save();

renderMenu();

return;

}


if(data.coins < cars[i].price){

showModal(`

<h2>
🔒 السيارة مقفلة
</h2>

<p>
تحتاج
<b>${cars[i].price}</b>
عملة لفتحها.
</p>

<button
class="btn start"
onclick="closeModal()">

حسنًا

</button>

`);

return;

}


data.coins-=cars[i].price;

data.owned[i]=true;

data.car=i;

save();

renderMenu();

}


/* =====================================================
                         CHOOSE LEVEL
===================================================== */

function chooseLevel(i){

data.level=i;

save();

renderMenu();

}


/* =====================================================
                         START GAME
===================================================== */

function startGame(){

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");


game={

running:true,

paused:false,

score:0,

coins:0,

health:3,

nitro:100,

enemies:[],

coinsObjects:[],

roadMove:0,

spawn:0,

coinSpawn:0,

shake:0

};


player.x=235;
player.y=640;


document.getElementById("status")
.textContent=
"السباق بدأ! 🏎️💨";


lastTime=performance.now();

cancelAnimationFrame(animation);

animation=
requestAnimationFrame(loop);

}


/* =====================================================
                         QUIT
===================================================== */

function quitGame(){

game.running=false;

cancelAnimationFrame(animation);

document.getElementById("game")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

renderMenu();

}


/* =====================================================
                         PAUSE
===================================================== */

function pauseGame(){

if(!game.running)
return;


game.paused=!game.paused;


if(game.paused){

document.getElementById("status")
.textContent="⏸️ اللعبة متوقفة";

return;

}


document.getElementById("status")
.textContent="🏎️ السباق مستمر";

lastTime=performance.now();

animation=
requestAnimationFrame(loop);

}


/* =====================================================
                         SPAWN ENEMY
===================================================== */

function spawnEnemy(){

const lane=
lanes[
Math.floor(
Math.random()*lanes.length
)
];


game.enemies.push({

x:lane-25,

y:-100,

width:50,
height:82,

speed:
(3+Math.random()*2)*
levels[data.level].speed

});

}


/* =====================================================
                         SPAWN COIN
===================================================== */

function spawnCoin(){

const lane=
lanes[
Math.floor(
Math.random()*lanes.length
)
];


game.coinsObjects.push({

x:lane,
y:-30

});

}


/* =====================================================
                         COLLISION
===================================================== */

function collision(a,b){

return(

a.x < b.x+b.width &&

a.x+a.width > b.x &&

a.y < b.y+b.height &&

a.y+a.height > b.y

);

}


/* =====================================================
                         UPDATE
===================================================== */

function update(dt){

const car=
cars[data.car];


/* SPEED */

let speed=car.speed;


/* NITRO */

if(
keys.nitro &&
game.nitro>0
){

speed+=6;

game.nitro-=35*dt;

}else{

game.nitro+=8*dt;

}


game.nitro=
Math.max(
0,
Math.min(
100,
game.nitro
)
);


/* MOVEMENT */

if(keys.left){

player.x-=
speed*60*dt;

}


if(keys.right){

player.x+=
speed*60*dt;

}


/* ROAD LIMIT */

player.x=
Math.max(
roadX+10,
Math.min(
roadX+
roadWidth-
player.width-
10,
player.x
)
);


/* ROAD */

game.roadMove+=
speed*60*dt;


/* SPAWN */

game.spawn+=dt;
game.coinSpawn+=dt;


if(game.spawn>0.8){

spawnEnemy();

game.spawn=0;

}


if(game.coinSpawn>0.7){

spawnCoin();

game.coinSpawn=0;

}


/* ENEMIES */

game.enemies.forEach(enemy=>{

enemy.y+=
enemy.speed*
60*
dt;

});


/* COINS */

game.coinsObjects.forEach(c=>{

c.y+=
300*
dt;

});


/* COLLISION ENEMIES */

for(
let i=game.enemies.length-1;
i>=0;
i--
){

let enemy=
game.enemies[i];


if(
collision(player,enemy)
){

game.enemies.splice(i,1);

game.health--;

game.shake=12;


if(game.health<=0){

endGame();

return;

}

}


else if(
enemy.y>H+100
){

game.enemies.splice(i,1);

game.score+=20;

}

}


/* COINS */

for(
let i=game.coinsObjects.length-1;
i>=0;
i--
){

let c=
game.coinsObjects[i];


let coinBox={

x:c.x-12,
y:c.y-12,

width:24,
height:24

};


if(
collision(
player,
coinBox
)
){

game.coinsObjects.splice(i,1);

game.coins++;

game.score+=50;

}

else if(c.y>H){

game.coinsObjects.splice(i,1);

}

}


/* SCORE */

game.score+=
dt*15;


updateHUD();

}


/* =====================================================
                         HUD
===================================================== */

function updateHUD(){

document.getElementById("score")
.textContent=
Math.floor(game.score);

document.getElementById("runCoins")
.textContent=
game.coins;

document.getElementById("health")
.textContent=
game.health;

document.getElementById("nitroValue")
.textContent=
Math.floor(game.nitro);

}


/* =====================================================
                         DRAW ROAD
===================================================== */

function drawRoad(){

const level=
levels[data.level];


/* SKY */

let sky=
ctx.createLinearGradient(
0,
0,
0,
H
);


if(data.level===0){

sky.addColorStop(
0,
"#72b9e8"
);

sky.addColorStop(
1,
"#3d8d52"
);

}


if(data.level===1){

sky.addColorStop(
0,
"#f2c77b"
);

sky.addColorStop(
1,
"#d0954d"
);

}


if(data.level===2){

sky.addColorStop(
0,
"#d9f7ff"
);

sky.addColorStop(
1,
"#91cbdc"
);

}


if(data.level===3){

sky.addColorStop(
0,
"#050b20"
);

sky.addColorStop(
1,
"#142c52"
);

}


ctx.fillStyle=sky;

ctx.fillRect(
0,
0,
W,
H
);


/* GROUND */

ctx.fillStyle=
level.background;

ctx.fillRect(
0,
180,
W,
H-180
);


/* ROAD SHADOW */

ctx.fillStyle=
"rgba(0,0,0,.25)";

ctx.fillRect(
roadX-18,
0,
18,
H
);

ctx.fillRect(
roadX+roadWidth,
0,
18,
H
);


/* ROAD */

let roadGradient=
ctx.createLinearGradient(
roadX,
0,
roadX+roadWidth,
0
);

roadGradient.addColorStop(
0,
"#22262a"
);

roadGradient.addColorStop(
.15,
"#3b4045"
);

roadGradient.addColorStop(
.5,
"#303438"
);

roadGradient.addColorStop(
.85,
"#3b4045"
);

roadGradient.addColorStop(
1,
"#22262a"
);


ctx.fillStyle=
roadGradient;

ctx.fillRect(
roadX,
0,
roadWidth,
H
);


/* ROAD TEXTURE */

for(
let y=0;
y<H;
y+=14
){

ctx.fillStyle=
"rgba(255,255,255,.025)";

ctx.fillRect(
roadX+
10+
Math.random()*
(roadWidth-20),
y,
2,
1
);

}


/* EDGE */

ctx.fillStyle="#eeeeee";

ctx.fillRect(
roadX-8,
0,
6,
H
);

ctx.fillRect(
roadX+roadWidth+2,
0,
6,
H
);


/* RED EDGE STRIPES */

let stripeOffset=
game.roadMove%80;


for(
let y=-80+stripeOffset;
y<H;
y+=80
){

ctx.fillStyle="#d93636";

ctx.fillRect(
roadX-8,
y,
6,
40
);

ctx.fillRect(
roadX+roadWidth+2,
y,
6,
40
);

}


/* LANE MARKINGS */

let laneOffset=
game.roadMove%120;


for(
let y=-120+laneOffset;
y<H;
y+=120
){

let mark=
ctx.createLinearGradient(
0,
y,
0,
y+55
);

mark.addColorStop(
0,
"#eeeeee"
);

mark.addColorStop(
.5,
"#ffffff"
);

mark.addColorStop(
1,
"#cfcfcf"
);

ctx.fillStyle=mark;

ctx.fillRect(
188,
y,
7,
55
);

ctx.fillRect(
290,
y,
7,
55
);

}


/* CITY */

if(data.level===0){

/* buildings */

for(
let i=0;
i<6;
i++
){

let x=
i<3
?
i*55
:
350+(i-3)*55;

let height=
100+
(i%3)*35;


ctx.fillStyle=
i%2
?
"#6d7884"
:
"#53616e";


ctx.fillRect(
x,
180-height,
45,
height
);


/* windows */

ctx.fillStyle="#ffe477";

for(
let wy=195-height;
wy<175;
wy+=22
){

ctx.fillRect(
x+8,
wy,
7,
9
);

ctx.fillRect(
x+28,
wy,
7,
9
);

}

}


/* trees */

for(
let y=260;
y<H;
y+=110
){

drawTree(25,y);

drawTree(
495,
y+45
);

}

}


/* DESERT */

if(data.level===1){

ctx.fillStyle="#dca65c";

for(
let i=0;
i<7;
i++
){

ctx.beginPath();

ctx.arc(
i*100-20,
190,
90,
Math.PI,
Math.PI*2
);

ctx.fill();

}


for(
let y=300;
y<H;
y+=130
){

drawRock(25,y);

drawRock(
490,
y+40
);

}

}


/* ICE */

if(data.level===2){

ctx.fillStyle="#e8fbff";

ctx.beginPath();

ctx.moveTo(
0,
210
);

for(
let x=0;
x<=W;
x+=70
){

ctx.lineTo(
x,
130+
Math.sin(x)*30
);

}

ctx.lineTo(W,240);
ctx.lineTo(0,240);

ctx.fill();


ctx.fillStyle=
"rgba(255,255,255,.45)";

for(
let y=280;
y<H;
y+=100
){

ctx.fillRect(
15,
y,
30,
3
);

ctx.fillRect(
475,
y+35,
30,
3
);

}

}


/* NIGHT */

if(data.level===3){

ctx.fillStyle="#ffffff";

for(
let i=0;
i<45;
i++
){

let x=
(i*83)%W;

let y=
(i*137)%180;

ctx.globalAlpha=
.4+(i%4)*.15;

ctx.fillRect(
x,
y,
2,
2
);

}

ctx.globalAlpha=1;


for(
let y=250;
y<H;
y+=100
){

drawLamp(
25,
y
);

drawLamp(
495,
y+50
);

}

}

}


/* =====================================================
                         TREE
===================================================== */

function drawTree(x,y){

ctx.fillStyle="#543b28";

ctx.fillRect(
x-4,
y-25,
8,
25
);


let g=
ctx.createRadialGradient(
x-5,
y-45,
3,
x,
y-40,
25
);

g.addColorStop(
0,
"#6fc45b"
);

g.addColorStop(
1,
"#174f28"
);

ctx.fillStyle=g;

ctx.beginPath();

ctx.arc(
x,
y-45,
22,
0,
Math.PI*2
);

ctx.fill();

}


/* =====================================================
                         ROCK
===================================================== */

function drawRock(x,y){

ctx.fillStyle="#7e6447";

ctx.beginPath();

ctx.moveTo(
x-18,
y
);

ctx.lineTo(
x-10,
y-18
);

ctx.lineTo(
x+8,
y-25
);

ctx.lineTo(
x+20,
y-5
);

ctx.lineTo(
x+15,
y+8
);

ctx.lineTo(
x-15,
y+8
);

ctx.closePath();

ctx.fill();

}


/* =====================================================
                         LAMP
===================================================== */

function drawLamp(x,y){

ctx.fillStyle="#222";

ctx.fillRect(
x-2,
y-60,
4,
60
);


ctx.fillStyle="#ffeaa0";

ctx.shadowColor="#ffeaa0";

ctx.shadowBlur=18;

ctx.beginPath();

ctx.arc(
x,
y-63,
7,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

}


/* =====================================================
                         ROUND RECT
===================================================== */

function roundRect(
x,
y,
w,
h,
r
){

r=
Math.min(
r,
w/2,
h/2
);

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.lineTo(
x+w-r,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

ctx.fill();

}


/* =====================================================
                         REALISTIC CAR
===================================================== */

function drawCar(
x,
y,
color
){

ctx.save();

ctx.translate(
x,
y
);


/* SHADOW */

ctx.fillStyle=
"rgba(0,0,0,.5)";

ctx.beginPath();

ctx.ellipse(
25,
84,
29,
9,
0,
0,
Math.PI*2
);

ctx.fill();


/* WHEELS */

ctx.fillStyle="#080a0c";

roundRect(
0,
10,
13,
27,
5
);

roundRect(
37,
10,
13,
27,
5
);

roundRect(
0,
54,
13,
27,
5
);

roundRect(
37,
54,
13,
27,
5
);


/* RIMS */

ctx.fillStyle="#bfc8cf";

ctx.beginPath();

ctx.arc(
6,
24,
4,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
44,
24,
4,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
6,
67,
4,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
44,
67,
4,
0,
Math.PI*2
);

ctx.fill();


/* BODY GRADIENT */

let body=
ctx.createLinearGradient(
0,
0,
50,
0
);

body.addColorStop(
0,
"#111"
);

body.addColorStop(
.12,
color
);

body.addColorStop(
.5,
"#ffffff"
);

body.addColorStop(
.7,
color
);

body.addColorStop(
1,
"#111"
);

ctx.fillStyle=body;

roundRect(
5,
0,
40,
82,
11
);


/* HOOD */

ctx.fillStyle=color;

roundRect(
9,
3,
32,
23,
8
);


/* WINDSHIELD */

let glass=
ctx.createLinearGradient(
0,
10,
0,
35
);

glass.addColorStop(
0,
"#e7fbff"
);

glass.addColorStop(
.4,
"#5e8fa8"
);

glass.addColorStop(
1,
"#17232d"
);

ctx.fillStyle=glass;

roundRect(
11,
12,
28,
25,
6
);


/* GLASS REFLECTION */

ctx.fillStyle=
"rgba(255,255,255,.5)";

ctx.fillRect(
14,
14,
4,
18
);


/* HEADLIGHTS */

ctx.fillStyle="#fff";

ctx.shadowColor="#fff";

ctx.shadowBlur=10;

roundRect(
9,
4,
9,
6,
3
);

roundRect(
32,
4,
9,
6,
3
);

ctx.shadowBlur=0;


/* TAIL LIGHTS */

ctx.fillStyle="#ff203c";

ctx.shadowColor="#ff203c";

ctx.shadowBlur=8;

roundRect(
9,
70,
9,
6,
3
);

roundRect(
32,
70,
9,
6,
3
);

ctx.shadowBlur=0;


/* SIDE LINE */

ctx.fillStyle=
"rgba(255,255,255,.35)";

ctx.fillRect(
9,
42,
32,
2
);


/* BODY SHINE */

ctx.fillStyle=
"rgba(255,255,255,.3)";

roundRect(
9,
47,
5,
18,
2
);


ctx.restore();

}


/* =====================================================
                         COIN
===================================================== */

function drawCoin(c){

ctx.save();

ctx.translate(
c.x,
c.y
);

ctx.shadowColor="#ffd83d";

ctx.shadowBlur=15;

let g=
ctx.createRadialGradient(
-3,
-3,
2,
0,
0,
13
);

g.addColorStop(
0,
"#fff5a0"
);

g.addColorStop(
.4,
"#ffd83d"
);

g.addColorStop(
1,
"#d39100"
);

ctx.fillStyle=g;

ctx.beginPath();

ctx.arc(
0,
0,
11,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

ctx.fillStyle="#8a5d00";

ctx.font="bold 14px Arial";

ctx.textAlign="center";

ctx.fillText(
"$",
0,
5
);

}


/* =====================================================
                         DRAW
===================================================== */

function draw(){

ctx.save();


/* SHAKE */

if(game.shake>0){

ctx.translate(
(Math.random()-.5)*game.shake,
(Math.random()-.5)*game.shake
);

game.shake=
Math.max(
0,
game.shake-.7
);

}


/* ROAD */

drawRoad();


/* COINS */

game.coinsObjects.forEach(
drawCoin
);


/* ENEMY CARS */

game.enemies.forEach(
enemy=>{

drawCar(
enemy.x,
enemy.y,
"#e84259"
);

}
);


/* PLAYER */

drawCar(
player.x,
player.y,
cars[data.car].color
);


/* NITRO FIRE */

if(
keys.nitro &&
game.nitro>0
){

let flame=
ctx.createLinearGradient(
0,
player.y+80,
0,
player.y+125
);

flame.addColorStop(
0,
"#ffffff"
);

flame.addColorStop(
.25,
"#00e5ff"
);

flame.addColorStop(
.7,
"#157cff"
);

flame.addColorStop(
1,
"rgba(0,0,255,0)"
);

ctx.fillStyle=flame;

ctx.beginPath();

ctx.moveTo(
player.x+14,
player.y+78
);

ctx.lineTo(
player.x+25,
player.y+125
);

ctx.lineTo(
player.x+36,
player.y+78
);

ctx.closePath();

ctx.fill();

}


ctx.restore();

}


/* =====================================================
                         GAME OVER
===================================================== */

function endGame(){

game.running=false;

cancelAnimationFrame(animation);


if(
game.score>
data.best
){

data.best=
Math.floor(game.score);

}


data.coins+=
game.coins;

save();


showModal(`

<h2>
🏁 انتهى السباق!
</h2>

<h1 style="color:#00e5ff">

${Math.floor(game.score)}

</h1>

<p>
💰 العملات:
<b>${game.coins}</b>
</p>

<button
class="btn start"
onclick="closeModal();startGame()">

🔄 إعادة السباق

</button>

<button
class="btn pink"
onclick="closeModal();quitGame()">

🏠 القائمة

</button>

`);

}


/* =====================================================
                         MODAL
===================================================== */

function showModal(html){

document.getElementById("modalBox")
.innerHTML=html;

document.getElementById("modal")
.classList.remove("hidden");

}


function closeModal(){

document.getElementById("modal")
.classList.add("hidden");

}


/* =====================================================
                         GAME LOOP
===================================================== */

function loop(time){

if(!game.running)
return;


if(game.paused)
return;


let dt=
(time-lastTime)/1000;


dt=
Math.min(
dt,
0.035
);


lastTime=time;


update(dt);

draw();


animation=
requestAnimationFrame(loop);

}


/* =====================================================
                         MOBILE CONTROLS
===================================================== */

function buttonControl(
id,
key
){

const button=
document.getElementById(id);


button.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

keys[key]=true;

}
);


button.addEventListener(
"pointerup",
()=>{

keys[key]=false;

}
);


button.addEventListener(
"pointercancel",
()=>{

keys[key]=false;

}
);


button.addEventListener(
"pointerleave",
()=>{

keys[key]=false;

}
);

}


buttonControl(
"left",
"left"
);

buttonControl(
"right",
"right"
);

buttonControl(
"nitroButton",
"nitro"
);


/* =====================================================
                         KEYBOARD
===================================================== */

document.addEventListener(
"keydown",
e=>{

if(
e.key==="ArrowLeft" ||
e.key.toLowerCase()==="a"
){

keys.left=true;

}


if(
e.key==="ArrowRight" ||
e.key.toLowerCase()==="d"
){

keys.right=true;

}


if(e.code==="Space"){

e.preventDefault();

keys.nitro=true;

}


if(
e.key.toLowerCase()==="p" &&
!e.repeat
){

pauseGame();

}

}
);


document.addEventListener(
"keyup",
e=>{

if(
e.key==="ArrowLeft" ||
e.key.toLowerCase()==="a"
){

keys.left=false;

}


if(
e.key==="ArrowRight" ||
e.key.toLowerCase()==="d"
){

keys.right=false;

}


if(e.code==="Space"){

keys.nitro=false;

}

}
);


/* =====================================================
                         START
===================================================== */

renderMenu();

</script>
