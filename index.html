<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed Race X</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:linear-gradient(135deg,#06101d,#162746);
    color:white;
    font-family:Arial,Tahoma,sans-serif;
    text-align:center;
}

.menu{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.panel{
    width:min(900px,95vw);
    background:#101a2d;
    padding:30px;
    border-radius:25px;
    box-shadow:0 20px 70px #000;
}

.logo{
    font-size:70px;
}

h1{
    font-size:55px;
    margin:5px;
}

h1 span{
    color:#00e5ff;
}

button,a{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    margin:7px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
}

.start{
    background:#00e5ff;
    color:#00131a;
}

.download{
    background:#21e787;
    color:#00150c;
}

.exit{
    background:#ff3d71;
    color:white;
}

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
}

.card{
    width:150px;
    padding:15px;
    background:#192840;
    border:2px solid #30445f;
    border-radius:16px;
    cursor:pointer;
}

.card.selected{
    border-color:#00e5ff;
    box-shadow:0 0 20px #00e5ff55;
}

.car{
    font-size:50px;
}

.stats{
    margin:20px;
}

.stat{
    display:inline-block;
    background:#18263d;
    padding:12px 20px;
    border-radius:12px;
    margin:5px;
}

#game{
    padding:10px;
}

.hidden{
    display:none!important;
}

.top{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    background:#101c31;
    border:1px solid #304461;
    padding:9px 13px;
    border-radius:10px;
}

.badge b{
    color:#00e5ff;
}

#canvas{
    display:block;
    width:min(520px,96vw);
    height:auto;
    margin:10px auto;
    border:3px solid #00e5ff;
    border-radius:15px;
    background:#333;
    touch-action:none;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    direction:ltr;
}

.control{
    width:90px;
    height:55px;
    background:#17263d;
    color:white;
}

.nitro{
    background:#21e787;
    color:#00150c;
}

.status{
    color:#aabbd2;
}

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:flex;
    justify-content:center;
    align-items:center;
}

.modalBox{
    background:#101a2d;
    padding:30px;
    border-radius:20px;
    width:min(450px,90vw);
}
</style>
</head>

<body>

<!-- القائمة -->
<div id="menu" class="menu">

<div class="panel">

<div class="logo">🏎️</div>

<h1>Speed <span>Race X</span></h1>

<p>لعبة سباق سيارات مطورة 🚀</p>

<div class="stats">

<div class="stat">
💰 <b id="coins">0</b>
</div>

<div class="stat">
🏆 <b id="best">0</b>
</div>

</div>

<h2>🚘 اختر السيارة</h2>

<div id="cars" class="cards"></div>

<h2>🏁 اختر المرحلة</h2>

<div id="levels" class="cards"></div>

<br>

<button class="start" onclick="startGame()">
🎮 ابدأ السباق
</button>

<a class="download" href="SpeedRace.zip" download>
⬇️ تحميل اللعبة
</a>

<p>
⬅️ ➡️ للحركة — Space للنيترو — P للإيقاف
</p>

</div>
</div>


<!-- اللعبة -->

<div id="game" class="hidden">

<div class="top">

<div class="badge">
🏆 <b id="score">0</b>
</div>

<div class="badge">
💰 <b id="runCoins">0</b>
</div>

<div class="badge">
❤️ <b id="health">3</b>
</div>

<div class="badge">
⚡ <b id="nitroValue">100</b>%
</div>

<button onclick="pauseGame()">
⏸️
</button>

<button class="exit" onclick="quitGame()">
خروج
</button>

</div>

<div class="status" id="status">
جاهز للسباق 🏎️
</div>

<canvas id="canvas" width="520" height="760"></canvas>

<div class="controls">

<button class="control" id="left">
⬅️
</button>

<button class="control nitro" id="nitroButton">
⚡
</button>

<button class="control" id="right">
➡️
</button>

</div>

</div>


<!-- نافذة النهاية -->

<div id="modal" class="modal hidden">

<div class="modalBox" id="modalBox"></div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const W=520;
const H=760;

const roadX=55;
const roadWidth=410;

const lanes=[100,205,310,415];

const cars=[

{
name:"البرق",
color:"#00bfff",
speed:5.5,
price:0
},

{
name:"الصقر",
color:"#ff3d71",
speed:6.5,
price:250
},

{
name:"الصاروخ",
color:"#21e787",
speed:7.5,
price:600
},

{
name:"الظل",
color:"#a56cff",
speed:8.5,
price:1200
}

];

const levels=[

{
name:"المدينة",
emoji:"🌆",
background:"#27753f",
road:"#363a3e",
speed:1
},

{
name:"الصحراء",
emoji:"🌵",
background:"#bd914d",
road:"#3b3937",
speed:1.25
},

{
name:"الجليد",
emoji:"❄️",
background:"#a9d8e7",
road:"#444c55",
speed:1.5
},

{
name:"الليل",
emoji:"🌃",
background:"#07162e",
road:"#252b35",
speed:1.8
}

];


let data=JSON.parse(
localStorage.getItem("speedRaceX")
);

if(!data){

data={
coins:0,
best:0,
car:0,
level:0,
owned:[true,false,false,false]
};

}

let player={
x:235,
y:640,
width:50,
height:82
};

let game={
running:false,
paused:false,
score:0,
coins:0,
health:3,
nitro:100,
enemies:[],
coinsObjects:[],
roadMove:0,
spawn:0,
coinSpawn:0
};

let keys={
left:false,
right:false,
nitro:false
};

let animation=0;
let lastTime=0;


function save(){

localStorage.setItem(
"speedRaceX",
JSON.stringify(data)
);

}


function renderMenu(){

document.getElementById("coins").textContent=data.coins;

document.getElementById("best").textContent=data.best;


document.getElementById("cars").innerHTML=
cars.map((car,i)=>`

<div class="card ${data.car===i?"selected":""}"
onclick="chooseCar(${i})">

<div class="car">🏎️</div>

<b>${car.name}</b>

<p>⚡ ${car.speed}</p>

<p>
${data.owned[i]
?"✓ مملوكة"
:"🔒 "+car.price+" 💰"}
</p>

</div>

`).join("");


document.getElementById("levels").innerHTML=
levels.map((level,i)=>`

<div class="card ${data.level===i?"selected":""}"
onclick="chooseLevel(${i})">

<div class="car">${level.emoji}</div>

<b>${level.name}</b>

</div>

`).join("");

}


function chooseCar(i){

if(data.owned[i]){

data.car=i;

save();

renderMenu();

return;

}


if(data.coins<cars[i].price){

alert(
"تحتاج "+cars[i].price+" عملة لشراء هذه السيارة."
);

return;

}

data.coins-=cars[i].price;

data.owned[i]=true;

data.car=i;

save();

renderMenu();

}


function chooseLevel(i){

data.level=i;

save();

renderMenu();

}


function startGame(){

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");


game={

running:true,

paused:false,

score:0,

coins:0,

health:3,

nitro:100,

enemies:[],

coinsObjects:[],

roadMove:0,

spawn:0,

coinSpawn:0

};


player.x=235;

player.y=640;


document.getElementById("status")
.textContent="السباق بدأ! 🏎️💨";


lastTime=performance.now();

cancelAnimationFrame(animation);

animation=requestAnimationFrame(loop);

}


function quitGame(){

game.running=false;

cancelAnimationFrame(animation);

document.getElementById("game")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

renderMenu();

}


function pauseGame(){

if(!game.running)return;

game.paused=!game.paused;

if(game.paused){

document.getElementById("status")
.textContent="⏸️ اللعبة متوقفة";

}else{

document.getElementById("status")
.textContent="🏎️ السباق مستمر";

lastTime=performance.now();

animation=requestAnimationFrame(loop);

}

}


function spawnEnemy(){

let lane=
lanes[Math.floor(Math.random()*lanes.length)];

game.enemies.push({

x:lane-25,

y:-100,

width:50,

height:82,

speed:
(3+Math.random()*2)*
levels[data.level].speed

});

}


function spawnCoin(){

let lane=
lanes[Math.floor(Math.random()*lanes.length)];

game.coinsObjects.push({

x:lane,

y:-30

});

}


function collision(a,b){

return (

a.x < b.x+b.width &&
a.x+a.width > b.x &&
a.y < b.y+b.height &&
a.y+a.height > b.y

);

}


function update(dt){

let car=cars[data.car];

let speed=car.speed;

if(keys.nitro && game.nitro>0){

speed+=6;

game.nitro-=35*dt;

}else{

game.nitro+=8*dt;

}

game.nitro=
Math.max(0,Math.min(100,game.nitro));


if(keys.left)
player.x-=speed*60*dt;

if(keys.right)
player.x+=speed*60*dt;


player.x=Math.max(
roadX+10,
Math.min(
roadX+roadWidth-player.width-10,
player.x
)
);


game.roadMove+=speed*60*dt;

game.spawn+=dt;

game.coinSpawn+=dt;


if(game.spawn>0.8){

spawnEnemy();

game.spawn=0;

}


if(game.coinSpawn>0.7){

spawnCoin();

game.coinSpawn=0;

}


game.enemies.forEach(enemy=>{

enemy.y+=enemy.speed*60*dt;

});


game.coinsObjects.forEach(c=>{

c.y+=300*dt;

});


for(
let i=game.enemies.length-1;
i>=0;
i--
){

let enemy=game.enemies[i];

if(collision(player,enemy)){

game.enemies.splice(i,1);

game.health--;

if(game.health<=0){

endGame();

return;

}

}else if(enemy.y>H+100){

game.enemies.splice(i,1);

game.score+=20;

}

}


for(
let i=game.coinsObjects.length-1;
i>=0;
i--
){

let c=game.coinsObjects[i];

let coinBox={

x:c.x-12,
y:c.y-12,
width:24,
height:24

};


if(collision(player,coinBox)){

game.coinsObjects.splice(i,1);

game.coins++;

game.score+=50;

}else if(c.y>H){

game.coinsObjects.splice(i,1);

}

}


game.score+=dt*15;

updateHUD();

}


function updateHUD(){

document.getElementById("score")
.textContent=Math.floor(game.score);

document.getElementById("runCoins")
.textContent=game.coins;

document.getElementById("health")
.textContent=game.health;

document.getElementById("nitroValue")
.textContent=Math.floor(game.nitro);

}


function drawRoad(){

let level=levels[data.level];

ctx.fillStyle=level.background;

ctx.fillRect(0,0,W,H);


ctx.fillStyle=level.road;

ctx.fillRect(
roadX,
0,
roadWidth,
H
);


ctx.fillStyle="#ffffff";

ctx.fillRect(
roadX-7,
0,
5,
H
);

ctx.fillRect(
roadX+roadWidth+2,
0,
5,
H
);


let offset=game.roadMove%120;


for(
let y=-120+offset;
y<H;
y+=120
){

ctx.fillRect(
188,
y,
7,
55
);

ctx.fillRect(
290,
y,
7,
55
);

}


if(data.level===0){

ctx.fillStyle="#5aaa45";

for(let y=40;y<H;y+=90){

ctx.beginPath();

ctx.arc(25,y,14,0,Math.PI*2);

ctx.fill();

ctx.beginPath();

ctx.arc(495,y+40,14,0,Math.PI*2);

ctx.fill();

}

}


if(data.level===1){

ctx.fillStyle="#d4a45f";

for(let y=50;y<H;y+=100){

ctx.fillRect(15,y,25,6);

ctx.fillRect(480,y+35,25,6);

}

}


if(data.level===2){

ctx.fillStyle="white";

for(let y=30;y<H;y+=100){

ctx.fillRect(15,y,25,4);

ctx.fillRect(480,y+40,25,4);

}

}


if(data.level===3){

ctx.fillStyle="#ffffff";

for(let i=0;i<35;i++){

ctx.fillRect(
(i*73)%W,
(i*131)%H,
2,
2
);

}

}

}


function roundRect(x,y,w,h,r){

ctx.beginPath();

ctx.moveTo(x+r,y);

ctx.lineTo(x+w-r,y);

ctx.quadraticCurveTo(
x+w,y,
x+w,y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,y+h,
x+w-r,y+h
);

ctx.lineTo(x+r,y+h);

ctx.quadraticCurveTo(
x,y+h,
x,y+h-r
);

ctx.lineTo(x,y+r);

ctx.quadraticCurveTo(
x,y,
x+r,y
);

ctx.closePath();

ctx.fill();

}


function drawCar(x,y,color){

ctx.save();

ctx.translate(x,y);


ctx.fillStyle="#111";

roundRect(2,12,10,25,4);

roundRect(38,12,10,25,4);

roundRect(2,55,10,25,4);

roundRect(38,55,10,25,4);


ctx.fillStyle=color;

roundRect(5,0,40,82,10);


ctx.fillStyle="#bfeeff";

roundRect(11,10,28,26,6);


ctx.fillStyle="#17202b";

roundRect(14,15,22,16,4);


ctx.fillStyle="#fff";

ctx.fillRect(10,4,8,3);

ctx.fillRect(32,4,8,3);


ctx.fillStyle="#ff304c";

ctx.fillRect(10,70,8,5);

ctx.fillRect(32,70,8,5);


ctx.restore();

}


function draw(){

drawRoad();


/* العملات */

game.coinsObjects.forEach(c=>{

ctx.fillStyle="#ffd83d";

ctx.beginPath();

ctx.arc(
c.x,
c.y,
11,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#8a5d00";

ctx.font="bold 14px Arial";

ctx.textAlign="center";

ctx.fillText(
"$",
c.x,
c.y+5
);

});


/* السيارات المنافسة */

game.enemies.forEach(enemy=>{

drawCar(
enemy.x,
enemy.y,
"#ef4057"
);

});


/* سيارة اللاعب */

drawCar(
player.x,
player.y,
cars[data.car].color
);


/* النيترو */

if(keys.nitro && game.nitro>0){

ctx.fillStyle="#00e5ff";

ctx.beginPath();

ctx.moveTo(
player.x+15,
player.y+82
);

ctx.lineTo(
player.x+25,
player.y+120
);

ctx.lineTo(
player.x+35,
player.y+82
);

ctx.fill();

}

}


function endGame(){

game.running=false;

cancelAnimationFrame(animation);


if(game.score>data.best){

data.best=Math.floor(game.score);

}


data.coins+=game.coins;

save();


document.getElementById("modalBox").innerHTML=`

<h2>🏁 انتهى السباق!</h2>

<h1 style="color:#00e5ff">
${Math.floor(game.score)}
</h1>

<p>
💰 حصلت على ${game.coins} عملة
</p>

<button class="start"
onclick="closeModal();startGame()">
🔄 إعادة السباق
</button>

<button class="exit"
onclick="closeModal();quitGame()">
🏠 القائمة
</button>

`;

document.getElementById("modal")
.classList.remove("hidden");

}


function closeModal(){

document.getElementById("modal")
.classList.add("hidden");

}


function loop(time){

if(!game.running)return;

if(game.paused)return;


let dt=(time-lastTime)/1000;

dt=Math.min(dt,0.035);

lastTime=time;


update(dt);

draw();


animation=requestAnimationFrame(loop);

}


/* أزرار الهاتف */

function buttonControl(id,key){

let button=document.getElementById(id);

button.addEventListener("pointerdown",e=>{

e.preventDefault();

keys[key]=true;

});

button.addEventListener("pointerup",()=>{

keys[key]=false;

});

button.addEventListener("pointercancel",()=>{

keys[key]=false;

});

button.addEventListener("pointerleave",()=>{

keys[key]=false;

});

}


buttonControl("left","left");

buttonControl("right","right");

buttonControl("nitroButton","nitro");


/* لوحة المفاتيح */

document.addEventListener("keydown",e=>{

if(
e.key==="ArrowLeft"||
e.key.toLowerCase()==="a"
)
keys.left=true;


if(
e.key==="ArrowRight"||
e.key.toLowerCase()==="d"
)
keys.right=true;


if(e.code==="Space")
keys.nitro=true;


if(
e.key.toLowerCase()==="p" &&
!e.repeat
)
pauseGame();

});


document.addEventListener("keyup",e=>{

if(
e.key==="ArrowLeft"||
e.key.toLowerCase()==="a"
)
keys.left=false;


if(
e.key==="ArrowRight"||
e.key.toLowerCase()==="d"
)
keys.right=false;


if(e.code==="Space")
keys.nitro=false;

});


renderMenu();

</script>

</body>
</html>
