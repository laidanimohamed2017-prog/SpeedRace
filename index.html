<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Speed Race X</title>

<style>
:root{
  --cyan:#00e5ff;
  --pink:#ff3d71;
  --green:#21e787;
  --bg:#070b16;
  --panel:#10182a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:radial-gradient(circle at top,#18284a,#070b16 65%);
  color:#fff;
}

body{overflow-x:hidden}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.hidden{display:none!important}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.panel{
  width:min(980px,96vw);
  background:rgba(10,17,32,.94);
  border:1px solid #2a3a5c;
  border-radius:28px;
  padding:28px;
  box-shadow:0 25px 80px #0009;
}

.logo{
  font-size:72px;
  filter:drop-shadow(0 0 18px #00e5ff88);
}

h1{
  font-size:clamp(42px,8vw,76px);
  margin:0 0 8px;
  letter-spacing:-2px;
}

h1 span{
  color:var(--cyan);
  text-shadow:0 0 20px #00e5ff55;
}

.sub{
  color:#aebbd2;
  font-size:18px;
  margin:0 auto 22px;
  max-width:680px;
  line-height:1.7;
}

.row{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:13px 20px;
  border-radius:13px;
  font-weight:800;
  transition:.18s;
  box-shadow:0 8px 20px #0004;
}

.btn:hover{
  transform:translateY(-2px);
}

.primary{
  background:var(--cyan);
  color:#041018;
}

.pink{
  background:var(--pink);
  color:#fff;
}

.green{
  background:var(--green);
  color:#041018;
}

.dark{
  background:#1a2740;
  color:#fff;
  border:1px solid #304261;
}

.download{
  display:inline-block;
  text-decoration:none;
}

.stats{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin:18px 0;
}

.stat{
  background:#17243a;
  border:1px solid #293c5d;
  border-radius:14px;
  padding:11px 17px;
}

.sectionTitle{
  margin:24px 0 10px;
}

.cards{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.card{
  width:180px;
  background:#162238;
  border:2px solid transparent;
  border-radius:18px;
  padding:15px;
  transition:.18s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-3px);
}

.card.selected{
  border-color:var(--cyan);
  box-shadow:0 0 20px #00e5ff22;
}

.card .emoji{
  font-size:58px;
}

.card small{
  color:#9eabc2;
}

.locked{
  opacity:.45;
  filter:grayscale(1);
}

#game{
  min-height:100vh;
  padding:10px 8px 16px;
}

.top{
  width:min(620px,98vw);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
}

.badge{
  background:#111c31;
  border:1px solid #293b5b;
  border-radius:11px;
  padding:8px 11px;
  font-weight:800;
}

.badge b{
  color:var(--cyan);
}

#pauseBtn{
  padding:8px 12px;
}

canvas{
  display:block;
  width:min(520px,96vw);
  height:auto;
  margin:10px auto 8px;
  border:2px solid #35e8ff;
  border-radius:16px;
  background:#2b2b2b;
  box-shadow:0 18px 50px #0009;
  touch-action:none;
}

.mobileControls{
  display:flex;
  justify-content:center;
  gap:14px;
  direction:ltr;
}

.ctrl{
  width:92px;
  height:55px;
  border-radius:15px;
  background:#17243a;
  color:#fff;
  border:1px solid #385071;
  font-size:25px;
  box-shadow:0 8px 18px #0005;
}

.ctrl.n{
  background:#21e787;
  color:#06120c;
}

.hint{
  color:#93a3bc;
  font-size:13px;
  text-align:center;
  margin-top:8px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#03060bcc;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal{
  width:min(520px,94vw);
  background:#101a2d;
  border:1px solid #334a70;
  border-radius:22px;
  padding:25px;
  box-shadow:0 25px 80px #000c;
}

.modal h2{
  margin-top:0;
}

.reward{
  font-size:30px;
  color:#ffd83d;
}

.shopGrid{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.shopItem{
  width:145px;
  background:#17243a;
  border:1px solid #2d4263;
  border-radius:15px;
  padding:12px;
}

.shopItem .emoji{
  font-size:44px;
}

.price{
  color:#ffd83d;
  font-weight:800;
}

@media(max-width:600px){
  .panel{padding:20px}
  .card{width:145px}
  .card .emoji{font-size:48px}
  .logo{font-size:58px}
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu" class="screen">

<div class="panel">

<div class="logo">🏎️</div>

<h1>
Speed <span>Race X</span>
</h1>

<p class="sub">
سباقات سريعة، نيترو، عملات، سيارات، مراحل متعددة،
مؤثرات، أصوات وتحكم للهاتف والكمبيوتر.
</p>

<div class="stats">

<div class="stat">
💰 <b id="coins">0</b>
</div>

<div class="stat">
🏆 <b id="best">0</b>
</div>

<div class="stat">
🚗 <b id="ownedCount">1</b> سيارات
</div>

</div>

<h2 class="sectionTitle">
🚘 اختر سيارتك
</h2>

<div id="cars" class="cards"></div>

<h2 class="sectionTitle">
🏁 اختر السباق
</h2>

<div id="levels" class="cards"></div>

<div class="row" style="margin-top:20px">

<button class="btn primary" onclick="startGame()">
🎮 ابدأ السباق
</button>

<button class="btn green" onclick="openShop()">
🛒 المتجر
</button>

<a class="btn pink download" href="SpeedRace.zip" download>
⬇️ تحميل اللعبة
</a>

</div>

<p class="hint">
الكمبيوتر: ← → أو A/D — النيترو: Space — إيقاف: P
</p>

</div>
</div>


<!-- ================= GAME ================= -->

<div id="game" class="hidden">

<div class="top">

<div class="badge">
🏆 <b id="score">0</b>
</div>

<div class="badge">
💰 <b id="runCoins">0</b>
</div>

<div class="badge">
❤️ <b id="hp">3</b>
</div>

<div class="badge">
⚡ <b id="nitro">100</b>%
</div>

<div class="badge">
🎯 <b id="mission">0/10</b>
</div>

<button id="pauseBtn" class="btn dark" onclick="togglePause()">
⏸️
</button>

<button class="btn pink" onclick="quitGame()">
خروج
</button>

</div>

<canvas id="canvas" width="520" height="760"></canvas>

<div class="mobileControls">

<button class="ctrl" id="left">
⬅️
</button>

<button class="ctrl n" id="nitroBtn">
⚡
</button>

<button class="ctrl" id="right">
➡️
</button>

</div>

<div class="hint">
اجمع العملات وتجنب السيارات واستخدم النيترو.
</div>

</div>


<!-- ================= MODAL ================= -->

<div id="modal" class="overlay hidden">

<div class="modal" id="modalBox"></div>

</div>


<script>

/* ================= CANVAS ================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const W=520;
const H=760;


/* ================= ROAD ================= */

const road={
 x:55,
 w:410
};

const lanes=[
 92,
 194,
 296,
 398
];


/* ================= CARS ================= */

const carDefs=[

 {
  name:"البرق",
  emoji:"🏎️",
  color:"#00bfff",
  speed:6,
  handling:7,
  price:0
 },

 {
  name:"الصقر",
  emoji:"🏎️",
  color:"#ff3d71",
  speed:7,
  handling:7.5,
  price:250
 },

 {
  name:"الصاروخ",
  emoji:"🚘",
  color:"#21e787",
  speed:8,
  handling:8,
  price:600
 },

 {
  name:"الظل",
  emoji:"🏁",
  color:"#a56cff",
  speed:9,
  handling:8.5,
  price:1200
 }

];


/* ================= LEVELS ================= */

const levelDefs=[

 {
  name:"المدينة",
  emoji:"🌆",
  bg:"#1b7040",
  road:"#30343a",
  speed:1
 },

 {
  name:"الصحراء",
  emoji:"🌵",
  bg:"#b88d45",
  road:"#393638",
  speed:1.25
 },

 {
  name:"الجليد",
  emoji:"❄️",
  bg:"#b7d9e8",
  road:"#3d4650",
  speed:1.5
 },

 {
  name:"الليل",
  emoji:"🌃",
  bg:"#07152d",
  road:"#242932",
  speed:1.8
 }

];


/* ================= SAVE ================= */

let data=JSON.parse(
 localStorage.getItem("speedRaceX")||"null"
)||{

 coins:0,
 best:0,
 owned:[true,false,false,false],
 selected:0,
 level:0,
 mission:0,
 missionProgress:0

};


/* ================= GAME STATE ================= */

let state={
 running:false,
 paused:false,
 score:0,
 coins:0,
 hp:3,
 nitro:100,
 distance:0,
 enemies:[],
 coinObjs:[],
 particles:[],
 spawn:0,
 coinSpawn:0,
 roadOffset:0,
 shake:0,
 speedVisual:0
};


let keys={
 left:false,
 right:false,
 nitro:false
};


let raf=0;
let last=0;
let audioCtx=null;


/* ================= PLAYER ================= */

const player={
 x:235,
 y:625,
 w:50,
 h:82,
 tilt:0
};


/* ================= HELPERS ================= */

function $(id){
 return document.getElementById(id);
}


function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}


function save(){
 localStorage.setItem(
  "speedRaceX",
  JSON.stringify(data)
 );
}


/* ================= MENU ================= */

function renderMenu(){

 $("coins").textContent=data.coins;
 $("best").textContent=data.best;

 $("ownedCount").textContent=
  data.owned.filter(Boolean).length;


 $("cars").innerHTML=
 carDefs.map((c,i)=>`

 <div class="card
 ${data.selected===i?"selected":""}
 ${!data.owned[i]?"locked":""}"
 onclick="selectCar(${i})">

 <div class="emoji">
 ${c.emoji}
 </div>

 <b>${c.name}</b>

 <div>
 ⚡ ${c.speed}
 |
 🎯 ${c.handling}
 </div>

 <small>
 ${
 data.owned[i]
 ?"مملوكة"
 :"🔒 "+c.price+" عملة"
 }
 </small>

 </div>

 `).join("");


 $("levels").innerHTML=
 levelDefs.map((l,i)=>`

 <div class="card
 ${data.level===i?"selected":""}
 ${i===3&&!data.owned[3]?"locked":""}"
 onclick="selectLevel(${i})">

 <div class="emoji">
 ${l.emoji}
 </div>

 <b>${l.name}</b>

 <small>
 ${
 i===3
 ?"تحتاج سيارة الظل"
 :"جاهز للسباق"
 }
 </small>

 </div>

 `).join("");

}


function selectCar(i){

 if(!data.owned[i]){

  if(data.coins>=carDefs[i].price){

   data.coins-=carDefs[i].price;

   data.owned[i]=true;

   data.selected=i;

   save();

   beep(700,.08);

  }else{

   return showModal(`

   <h2>🔒 السيارة مقفلة</h2>

   <p>
   تحتاج ${carDefs[i].price} عملة.
   </p>

   <div class="reward">
   💰 ${data.coins}
   </div>

   <button
   class="btn primary"
   onclick="closeModal()">
   حسنًا
   </button>

   `);

  }

 }else{

  data.selected=i;

 }


 if(data.selected!==3 && data.level===3){
  data.level=0;
 }

 renderMenu();

}


function selectLevel(i){

 if(i===3&&!data.owned[3]){

  return showModal(`

  <h2>🌃 المرحلة الليلية</h2>

  <p>
  افتح سيارة الظل أولًا.
  </p>

  <button
  class="btn primary"
  onclick="closeModal()">
  حسنًا
  </button>

  `);

 }

 data.level=i;

 renderMenu();

}


/* ================= SHOP ================= */

function openShop(){

 let items=carDefs.map((c,i)=>`

 <div class="shopItem">

 <div class="emoji">
 ${c.emoji}
 </div>

 <b>${c.name}</b>

 <p class="price">
 ${
 data.owned[i]
 ?"✓ مملوكة"
 :c.price+" 💰"
 }
 </p>

 <button
 class="btn
 ${data.owned[i]?"dark":"green"}"
 onclick="buyCar(${i})">

 ${
 data.owned[i]
 ?"اختيار"
 :"شراء"
 }

 </button>

 </div>

 `).join("");


 showModal(`

 <h2>🛒 متجر السيارات</h2>

 <p>
 رصيدك:
 <b>💰 ${data.coins}</b>
 </p>

 <div class="shopGrid">
 ${items}
 </div>

 <br>

 <button
 class="btn dark"
 onclick="closeModal()">
 إغلاق
 </button>

 `);

}


function buyCar(i){

 if(data.owned[i]){

  data.selected=i;

  closeModal();

  renderMenu();

  return;

 }


 if(data.coins<carDefs[i].price){

  return showModal(`

  <h2>❌ عملات غير كافية</h2>

  <p>
  تحتاج ${carDefs[i].price} عملة.
  </p>

  <button
  class="btn primary"
  onclick="openShop()">
  رجوع
  </button>

  `);

 }


 data.coins-=carDefs[i].price;

 data.owned[i]=true;

 data.selected=i;

 save();

 beep(800,.1);

 openShop();

}


function showModal(html){

 $("modalBox").innerHTML=html;

 $("modal").classList.remove("hidden");

}


function closeModal(){

 $("modal").classList.add("hidden");

}


/* ================= AUDIO ================= */

function startAudio(){

 if(!audioCtx){

  audioCtx=
   new(window.AudioContext||
   window.webkitAudioContext)();

 }

}


function beep(freq,dur){

 try{

  startAudio();

  let o=audioCtx.createOscillator();
  let g=audioCtx.createGain();

  o.frequency.value=freq;

  o.type="square";

  g.gain.setValueAtTime(
   .035,
   audioCtx.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
   .001,
   audioCtx.currentTime+dur
  );

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();

  o.stop(
   audioCtx.currentTime+dur
  );

 }catch(e){}

}


/* ================= START ================= */

function startGame(){

 startAudio();

 $("menu").classList.add("hidden");

 $("game").classList.remove("hidden");

 state={
  running:true,
  paused:false,
  score:0,
  coins:0,
  hp:3,
  nitro:100,
  distance:0,
  enemies:[],
  coinObjs:[],
  particles:[],
  spawn:0,
  coinSpawn:0,
  roadOffset:0,
  shake:0,
  speedVisual:0
 };


 player.x=235;
 player.y=625;
 player.tilt=0;


 last=performance.now();

 cancelAnimationFrame(raf);

 raf=requestAnimationFrame(loop);

 beep(520,.12);

}


function quitGame(){

 state.running=false;

 cancelAnimationFrame(raf);

 $("game").classList.add("hidden");

 $("menu").classList.remove("hidden");

 renderMenu();

}


/* ================= PAUSE ================= */

function togglePause(){

 if(!state.running)return;

 state.paused=!state.paused;

 $("pauseBtn").textContent=
 state.paused?"▶️":"⏸️";

 if(!state.paused){

  last=performance.now();

  raf=requestAnimationFrame(loop);

 }

}


/* ================= GAME OVER ================= */

function gameOver(){

 state.running=false;

 data.coins+=state.coins;

 if(state.score>data.best){

  data.best=Math.floor(state.score);

 }


 data.missionProgress=
 Math.min(
  10,
  data.missionProgress+
  Math.floor(state.coins/3)
 );


 let reward=0;

 if(data.missionProgress>=10){

  data.missionProgress=0;

  data.mission=
   (data.mission+1)%3;

  reward=150;

  data.coins+=reward;

 }


 save();

 beep(160,.35);


 showModal(`

 <h2>🏁 انتهى السباق!</h2>

 <div class="reward">
 ${Math.floor(state.score)} نقطة
 </div>

 <p>
 💰 العملات:
 ${state.coins}
 </p>

 ${
 reward
 ?`<p>🎁 مكافأة المهمة: +${reward}</p>`
 :""
 }

 <button
 class="btn primary"
 onclick="closeModal();startGame()">
 🔄 إعادة السباق
 </button>

 <button
 class="btn dark"
 onclick="closeModal();quitGame()">
 🏠 القائمة
 </button>

 `);

}


/* =====================================================
   السيارات المنافسة
   ===================================================== */

/*
   أهم جزء:
   السيارة المنافسة لا تبدأ من أعلى الشاشة.

   تبدأ من الأفق z=0.03
   ثم تتحرك تدريجيًا نحو اللاعب.

   z:
   0 = الأفق
   1 = السيارة أمام اللاعب
*/


function spawnEnemy(){

 let laneIndex=
  Math.floor(Math.random()*lanes.length);

 let laneX=lanes[laneIndex];

 /*
   z صغير جدًا = بعيد جدًا
 */
 let z=.02+Math.random()*.04;


 /*
   لا نضع سيارة فوق سيارة أخرى
 */
 if(
  state.enemies.some(
   e=>e.lane===laneIndex && e.z<.35
  )
 ){
  return;
 }


 state.enemies.push({

  lane:laneIndex,

  baseX:laneX,

  z:z,

  speed:
   .075+
   Math.random()*.035

 });

}


/*
   تحويل المسافة إلى منظور.
*/

function roadPerspective(z){

 z=clamp(z,0,1);

 /*
   منحنى منظور:
   بعيد = صغير
   قريب = كبير
 */
 let p=Math.pow(z,1.65);

 let horizonY=180;
 let playerY=625;

 let y=
  horizonY+
  (playerY-horizonY)*p;

 /*
   عرض الطريق عند هذه النقطة
 */
 let topWidth=75;
 let bottomWidth=410;

 let roadWidth=
  topWidth+
  (bottomWidth-topWidth)*p;


 let center=W/2;

 /*
   موضع السيارة داخل الطريق
 */
 let laneOffset=
  (lanes[0]-W/2)*p;


 return{
  p,
  y,
  roadWidth,
  center
 };

}


/*
   تحديث السيارات المنافسة.
*/

function updateEnemies(dt){

 state.enemies.forEach(e=>{

  /*
    كلما تقدم الوقت تقترب السيارة
  */
  e.z+=
   e.speed*
   dt*
   (1+
   levelDefs[data.level].speed*.45);

 });


 /*
   إزالة السيارات التي تجاوزت اللاعب
 */
 state.enemies=
 state.enemies.filter(
  e=>e.z<1.12
 );

}


/*
   رسم سيارة منافسة حسب بعدها.
*/

function drawEnemy(e){

 let z=clamp(e.z,0,1);

 let p=Math.pow(z,1.65);

 let roadData=
  roadPerspective(z);


 /*
   موقع الحارة حسب المنظور
 */
 let laneCenter=
  e.baseX;


 let x=
  W/2+
  (laneCenter-W/2)*p;


 /*
   حجم السيارة
 */
 let scale=
  .16+
  p*.95;


 let w=50*scale;
 let h=82*scale;


 let y=
  roadData.y-h;


 /*
   ظل السيارة
 */
 ctx.save();

 ctx.globalAlpha=
  .18+
  p*.3;

 ctx.fillStyle="#000";

 ctx.beginPath();

 ctx.ellipse(
  x+w/2,
  y+h*.94,
  w*.65,
  h*.10,
  0,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.restore();


 /*
   السيارة
 */
 ctx.save();

 ctx.translate(x,y);

 /*
   حركة بسيطة للسيارة
 */
 let vibration=
  Math.sin(performance.now()*.01+
  e.lane)*p*1.2;

 ctx.translate(vibration,0);

 ctx.scale(scale,scale);

 drawCarBody(
  0,
  0,
  "#ff465d",
  true
 );

 ctx.restore();

}


/* ================= COINS ================= */

function spawnCoin(){

 let laneIndex=
  Math.floor(Math.random()*lanes.length);

 state.coinObjs.push({

  lane:laneIndex,

  z:.02,

  spin:0

 });

}


function updateCoins(dt){

 state.coinObjs.forEach(c=>{

  c.z+=.13*dt;

  c.spin+=dt*8;

 });


 state.coinObjs=
 state.coinObjs.filter(
  c=>c.z<1.1
 );

}


/* ================= COLLISION ================= */

function checkEnemyCollision(){

 for(let i=state.enemies.length-1;i>=0;i--){

  let e=state.enemies[i];

  /*
    الاصطدام فقط عندما تقترب السيارة
  */
  if(e.z>.78 && e.z<1.03){

   let laneX=e.baseX;

   let distance=
    Math.abs(
     (player.x+25)-laneX
    );


   if(distance<38){

    state.enemies.splice(i,1);

    state.hp--;

    state.shake=12;

    beep(90,.16);


    for(let j=0;j<18;j++){

     particle(
      player.x+25,
      player.y+35,
      "#ff4d5f",
      5
     );

    }


    if(state.hp<=0){

     gameOver();

     return true;

    }

   }

  }

 }

 return false;

}


/* ================= PLAYER COIN ================= */

function checkCoinCollision(){

 for(
  let i=state.coinObjs.length-1;
  i>=0;
  i--
 ){

  let c=state.coinObjs[i];

  if(c.z>.82){

   let laneX=lanes[c.lane];

   if(
    Math.abs(
     player.x+25-laneX
    )<38
   ){

    state.coinObjs.splice(i,1);

    state.coins++;

    state.score+=50;

    beep(880,.045);


    for(let j=0;j<6;j++){

     particle(
      laneX,
      player.y,
      "#ffd83d",
      2
     );

    }

   }

  }

 }

}


/* ================= UPDATE ================= */

function update(dt){

 let car=
  carDefs[data.selected];

 let level=
  levelDefs[data.level];


 /*
   التحكم
 */
 if(keys.left){

  player.x-=
   car.handling*
   dt*
   60;

  player.tilt=
   clamp(
    player.tilt-.08,
    -.22,
    .22
   );

 }else if(keys.right){

  player.x+=
   car.handling*
   dt*
   60;

  player.tilt=
   clamp(
    player.tilt+.08,
    -.22,
    .22
   );

 }else{

  player.tilt*=.88;

 }


 player.x=
  clamp(
   player.x,
   road.x+10,
   road.x+road.w-player.w-10
  );


 /*
   Nitro
 */
 let boost=
  keys.nitro &&
  state.nitro>0;


 if(boost){

  state.nitro=
   clamp(
    state.nitro-dt*32,
    0,
    100
   );


  for(let i=0;i<3;i++){

   particle(
    player.x+25,
    player.y+78,
    "#00e5ff",
    3
   );

  }

 }else{

  state.nitro=
   clamp(
    state.nitro+dt*6,
    0,
    100
   );

 }


 /*
   سرعة الطريق
 */
 let roadSpeed=
  (car.speed+
  (boost?7:0))*
  level.speed;


 state.speedVisual=
  roadSpeed;


 /*
   حركة الطريق
 */
 state.roadOffset+=
  roadSpeed*
  dt*
  18;


 /*
   السيارات
 */
 state.spawn+=dt;


 let spawnTime=
  .95-
  Math.min(
   state.score/10000,
   .35
  );


 if(state.spawn>spawnTime){

  spawnEnemy();

  state.spawn=0;

 }


 updateEnemies(dt);

 updateCoins(dt);

 checkEnemyCollision();

 checkCoinCollision();


 /*
   العملات
 */
 state.coinSpawn+=dt;

 if(state.coinSpawn>.8){

  spawnCoin();

  state.coinSpawn=0;

 }


 /*
   النقاط
 */
 state.score+=
  dt*
  (12+
  roadSpeed*.8);


 /*
   اهتزاز
 */
 state.shake=
  Math.max(
   0,
   state.shake-dt*15
  );


 updateParticles(dt);

 updateHUD();

}


/* ================= HUD ================= */

function updateHUD(){

 $("score").textContent=
  Math.floor(state.score);

 $("runCoins").textContent=
  state.coins;

 $("hp").textContent=
  state.hp;

 $("nitro").textContent=
  Math.floor(state.nitro);

 $("mission").textContent=
  data.missionProgress+"/10";

}


/* ================= PARTICLES ================= */

function particle(
 x,
 y,
 color,
 size
){

 state.particles.push({

  x,
  y,

  vx:
   (Math.random()-.5)*
   size*2,

  vy:
   (Math.random()-.5)*
   size*2,

  life:
   .35+
   Math.random()*.6,

  color,

  size:
   2+
   Math.random()*size

 });

}


function updateParticles(dt){

 state.particles.forEach(p=>{

  p.x+=
   p.vx*
   60*
   dt;

  p.y+=
   p.vy*
   60*
   dt;

  p.vy+=
   .05;

  p.life-=dt;

 });


 state.particles=
  state.particles.filter(
   p=>p.life>0
  );

}


/* =====================================================
   الطريق
   ===================================================== */

function drawRoad(){

 let level=
  levelDefs[data.level];


 /*
   السماء / البيئة
 */
 ctx.fillStyle=level.bg;

 ctx.fillRect(
  0,
  0,
  W,
  H
 );


 /*
   الأفق
 */
 let horizon=180;


 /*
   الأرض
 */
 ctx.fillStyle=
  data.level===2
  ?"#dceff7"
  :level.bg;

 ctx.fillRect(
  0,
  horizon,
  W,
  H-horizon
 );


 /*
   الطريق بمنظور
 */
 let topRoad=72;
 let bottomRoad=420;

 ctx.fillStyle=
  level.road;


 ctx.beginPath();

 ctx.moveTo(
  W/2-topRoad/2,
  horizon
 );

 ctx.lineTo(
  W/2+topRoad/2,
  horizon
 );

 ctx.lineTo(
  W/2+bottomRoad/2,
  H
 );

 ctx.lineTo(
  W/2-bottomRoad/2,
  H
 );

 ctx.closePath();

 ctx.fill();


 /*
   حواف الطريق
 */
 ctx.strokeStyle=
  "#eeeeee";

 ctx.lineWidth=5;

 ctx.beginPath();

 ctx.moveTo(
  W/2-topRoad/2,
  horizon
 );

 ctx.lineTo(
  W/2-bottomRoad/2,
  H
 );

 ctx.stroke();


 ctx.beginPath();

 ctx.moveTo(
  W/2+topRoad/2,
  horizon
 );

 ctx.lineTo(
  W/2+bottomRoad/2,
  H
 );

 ctx.stroke();


 /*
   خطوط منتصف الطريق
 */
 let offset=
  state.roadOffset%90;


 for(
  let i=-1;
  i<18;
  i++
 ){

  let z=
   (i*0.075+
   offset/1200);

  z=
   z-Math.floor(z);

  let p=
   Math.pow(z,1.7);

  let y=
   horizon+
   (H-horizon)*p;


  let width=
   3+p*10;

  let len=
   12+p*55;


  ctx.fillStyle="#fff";

  ctx.fillRect(
   W/2-width/2,
   y,
   width,
   len
  );

 }


 /*
   خطوط سرعة جانبية
 */
 if(state.speedVisual>7){

  for(let i=0;i<12;i++){

   let y=
    200+
    ((i*73+
    state.roadOffset*3)%520);

   let len=
    20+
    state.speedVisual*2;

   ctx.strokeStyle=
    "rgba(255,255,255,.25)";

   ctx.lineWidth=2;

   ctx.beginPath();

   ctx.moveTo(
    15+i*8,
    y
   );

   ctx.lineTo(
    15+i*8,
    y+len
   );

   ctx.stroke();


   ctx.beginPath();

   ctx.moveTo(
    W-15-i*8,
    y+30
   );

   ctx.lineTo(
    W-15-i*8,
    y+30+len
   );

   ctx.stroke();

  }

 }


 /*
   المدينة
 */
 if(data.level===0){

  ctx.fillStyle="#26364c";

  for(let i=0;i<10;i++){

   let bh=
    35+
    (i%4)*22;

   ctx.fillRect(
    i*58,
    horizon-bh,
    40,
    bh
   );

  }

 }


 /*
   الصحراء
 */
 if(data.level===1){

  ctx.fillStyle="#d7a85d";

  for(let i=0;i<8;i++){

   ctx.beginPath();

   ctx.arc(
    i*80,
    horizon+35+
    (i%2)*20,
    45,
    Math.PI,
    Math.PI*2
   );

   ctx.fill();

  }

 }


 /*
   الجليد
 */
 if(data.level===2){

  ctx.fillStyle="#fff";

  for(let i=0;i<8;i++){

   ctx.beginPath();

   ctx.moveTo(
    i*75,
    horizon
   );

   ctx.lineTo(
    i*75+38,
    horizon-65-
    (i%3)*20
   );

   ctx.lineTo(
    i*75+76,
    horizon
   );

   ctx.fill();

  }

 }


 /*
   الليل والنجوم
 */
 if(data.level===3){

  ctx.fillStyle="#fff";

  for(let i=0;i<80;i++){

   let x=
    (i*73)%W;

   let y=
    (i*37)%220;

   ctx.fillRect(
    x,
    y,
    2,
    2
   );

  }

 }

}


/* ================= CAR ================= */

function roundedRect(
 x,
 y,
 w,
 h,
 r
){

 ctx.beginPath();

 ctx.moveTo(x+r,y);

 ctx.lineTo(x+w-r,y);

 ctx.quadraticCurveTo(
  x+w,
  y,
  x+w,
  y+r
 );

 ctx.lineTo(
  x+w,
  y+h-r
 );

 ctx.quadraticCurveTo(
  x+w,
  y+h,
  x+w-r,
  y+h
 );

 ctx.lineTo(
  x+r,
  y+h
 );

 ctx.quadraticCurveTo(
  x,
  y+h,
  x,
  y+h-r
 );

 ctx.lineTo(
  x,
  y+r
 );

 ctx.quadraticCurveTo(
  x,
  y,
  x+r,
  y
 );

 ctx.closePath();

 ctx.fill();

}


/*
   جسم السيارة
 */
function drawCarBody(
 x,
 y,
 color,
 enemy=false
){

 ctx.save();

 ctx.translate(x,y);


 /*
   ظل
 */
 ctx.fillStyle=
  "rgba(0,0,0,.35)";

 ctx.beginPath();

 ctx.ellipse(
  25,
  82,
  29,
  7,
  0,
  0,
  Math.PI*2
 );

 ctx.fill();


 /*
   العجلات
 */
 ctx.fillStyle="#101010";

 roundedRect(
  2,
  12,
  10,
  24,
  4
 );

 roundedRect(
  38,
  12,
  10,
  24,
  4
 );

 roundedRect(
  2,
  55,
  10,
  24,
  4
 );

 roundedRect(
  38,
  55,
  10,
  24,
  4
 );


 /*
   الجسم
 */
 let gradient=
  ctx.createLinearGradient(
   0,
   0,
   50,
   82
  );

 gradient.addColorStop(
  0,
  "#ffffff55"
 );

 gradient.addColorStop(
  .25,
  color
 );

 gradient.addColorStop(
  1,
  "#050505"
 );


 ctx.fillStyle=gradient;

 roundedRect(
  5,
  0,
  40,
  82,
  10
 );


 /*
   الزجاج
 */
 ctx.fillStyle=
  enemy
  ?"#ffd1d8"
  :"#c9f6ff";


 roundedRect(
  11,
  11,
  28,
  25,
  6
 );


 /*
   الزجاج الداكن
 */
 ctx.fillStyle=
  "#101826";


 roundedRect(
  13,
  16,
  24,
  16,
  4
 );


 /*
   خط السقف
 */
 ctx.strokeStyle=
  "rgba(255,255,255,.4)";

 ctx.lineWidth=2;

 ctx.beginPath();

 ctx.moveTo(
  25,
  10
 );

 ctx.lineTo(
  25,
  36
 );

 ctx.stroke();


 /*
   المصابيح الأمامية
 */
 ctx.fillStyle="#fff";

 ctx.shadowBlur=10;

 ctx.shadowColor="#fff";

 ctx.fillRect(
  10,
  4,
  8,
  3
 );

 ctx.fillRect(
  32,
  4,
  8,
  3
 );

 ctx.shadowBlur=0;


 /*
   الأضواء الخلفية
 */
 ctx.fillStyle="#ff334f";

 ctx.fillRect(
  10,
  70,
  8,
  5
 );

 ctx.fillRect(
  32,
  70,
  8,
  5
 );


 /*
   الصدام
 */
 ctx.fillStyle="#080808";

 roundedRect(
  12,
  76,
  26,
  4,
  2
 );


 ctx.restore();

}


/*
   رسم سيارة اللاعب
 */
function drawPlayer(){

 ctx.save();

 /*
   ميلان السيارة عند الانعطاف
 */
 ctx.translate(
  player.x+25,
  player.y+41
 );

 ctx.rotate(
  player.tilt
 );

 ctx.translate(
  -25,
  -41
 );


 drawCarBody(
  0,
  0,
  carDefs[data.selected].color,
  false
 );


 /*
   Nitro
 */
 if(keys.nitro&&state.nitro>0){

  let flame=
   28+
   Math.random()*25;

  ctx.fillStyle=
   "#00e5ff";

  ctx.beginPath();

  ctx.moveTo(
   17,
   80
  );

  ctx.lineTo(
   25,
   80+flame
  );

  ctx.lineTo(
   33,
   80
  );

  ctx.fill();


  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.moveTo(
   21,
   80
  );

  ctx.lineTo(
   25,
   80+flame*.65
  );

  ctx.lineTo(
   29,
   80
  );

  ctx.fill();

 }

 ctx.restore();

}


/* ================= DRAW ================= */

function draw(){

 let sx=0;
 let sy=0;

 if(state.shake>0){

  sx=
   (Math.random()-.5)*
   state.shake;

  sy=
   (Math.random()-.5)*
   state.shake;

 }


 ctx.save();

 ctx.translate(
  sx,
  sy
 );


 /*
   الطريق
 */
 drawRoad();


 /*
   السيارات المنافسة
 */
 state.enemies.forEach(
  drawEnemy
 );


 /*
   العملات
 */
 state.coinObjs.forEach(c=>{

  let z=
   clamp(c.z,0,1);

  let p=
   Math.pow(z,1.7);

  let y=
   180+
   (625-180)*p;

  let x=
   W/2+
   (lanes[c.lane]-W/2)*p;

  let scale=
   .25+
   p*.9;

  ctx.save();

  ctx.translate(
   x,
   y
  );

  ctx.scale(
   scale,
   scale
  );

  ctx.rotate(
   Math.sin(c.spin)
  );

  ctx.fillStyle=
   "#ffd83d";

  ctx.beginPath();

  ctx.arc(
   0,
   0,
   11,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#9b6900";

  ctx.font=
   "bold 13px Arial";

  ctx.textAlign="center";

  ctx.fillText(
   "$",
   0,
   5
  );

  ctx.restore();

 });


 /*
   السيارة الرئيسية
 */
 drawPlayer();


 /*
   الجزيئات
 */
 state.particles.forEach(p=>{

  ctx.globalAlpha=
   Math.max(
    0,
    p.life
   );

  ctx.fillStyle=
   p.color;

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   p.size,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

 });


 ctx.restore();

}


/* ================= LOOP ================= */

function loop(t){

 if(!state.running)
  return;


 if(state.paused){

  draw();

  return;

 }


 let dt=
  Math.min(
   .035,
   (t-last)/1000||.016
  );

 last=t;


 update(dt);

 draw();


 raf=
  requestAnimationFrame(loop);

}


/* ================= MOBILE ================= */

function bindHold(id,type){

 let b=$(id);


 b.addEventListener(
  "pointerdown",
  e=>{

   e.preventDefault();

   keys[type]=true;

  }
 );


 [
  "pointerup",
  "pointercancel",
  "pointerleave"
 ].forEach(ev=>

  b.addEventListener(
   ev,
   ()=>{
    keys[type]=false;
   }
  )

 );

}


bindHold(
 "left",
 "left"
);

bindHold(
 "right",
 "right"
);

bindHold(
 "nitroBtn",
 "nitro"
);


/* ================= KEYBOARD ================= */

document.addEventListener(
 "keydown",
 e=>{

  if(
   e.key==="ArrowLeft"||
   e.key.toLowerCase()==="a"
  ){

   keys.left=true;

  }


  if(
   e.key==="ArrowRight"||
   e.key.toLowerCase()==="d"
  ){

   keys.right=true;

  }


  if(e.code==="Space"){

   keys.nitro=true;

  }


  if(
   e.key.toLowerCase()==="p" &&
   !e.repeat
  ){

   togglePause();

  }

 }
);


document.addEventListener(
 "keyup",
 e=>{

  if(
   e.key==="ArrowLeft"||
   e.key.toLowerCase()==="a"
  ){

   keys.left=false;

  }


  if(
   e.key==="ArrowRight"||
   e.key.toLowerCase()==="d"
  ){

   keys.right=false;

  }


  if(e.code==="Space"){

   keys.nitro=false;

  }

 }
);


/* ================= START MENU ================= */

renderMenu();

</script>
